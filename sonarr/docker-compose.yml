services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /home/adam/sonarr:/config
      - /mnt/poolmedia/Series:/tv
      - /mnt/poolmedia/downloads:/downloads
    ports:
      - 8989:8989
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
