services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - /home/adam/homepage:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
      - /mnt:/mnt:ro
      - /home/adam/homelav:/homelav:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"  # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

